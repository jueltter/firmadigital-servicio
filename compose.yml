name: firmadigital-servicio

services:
  firmadigital-servicio:
    build:
      context: .
      args:
        MAIN_DOMAIN_ARG: ${MAIN_DOMAIN_ARG}
        MAVEN_REPO: ${MAVEN_REPO}
      secrets:
        - maven-settings
    container_name: firmadigital-servicio
    image: firmadigital-servicio:local
    restart: unless-stopped
    ports:
      - "8080:8080"    # HTTP port
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "java /opt/payara/HealthCheck.java || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sql_data:

secrets:
  maven-settings:
    file: ./.gitlab-ci/variables/settings.xml