workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^((\d+\.\d+\.\d+)|latest)$/'
    - when: never

stages:
  - build
  - deploy

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "$REGISTRY_DOMAIN/development/firmaec/firmadigital-servicio/firmadigital-servicio"
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

build_and_push:
  stage: build
  image: docker:29.6.0-cli
  services:
    - name: docker:29.6.0-dind
  tags:
    - shared
  cache:
    key:
      files:
        - firmadigital-servicio/pom.xml
    paths:
      - .m2/repository
    policy: pull-push
  before_script:
    - apk add --no-cache ca-certificates gettext
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - mkdir -p .m2/repository
  script:
    - cp "$INTERNAL_CA_CERT" ./.gitlab-ci/variables/main-domain.pem
    - cp "$OLD_INTERNAL_CA_CERT" ./.gitlab-ci/variables/old-main-domain.pem
    - export MAVEN_USERNAME=$MAVEN_USERNAME
    - export MAVEN_PASSWORD=$MAVEN_PASSWORD
    - envsubst < .gitlab-ci/variables/settings.xml.template > .gitlab-ci/variables/settings.xml
    - |
      docker build --no-cache --provenance=false --platform linux/amd64 \
      --build-arg MAVEN_REPO=.m2/repository \
      --build-arg MAIN_DOMAIN_ARG=$MAIN_DOMAIN \
      --secret id=maven-settings,src=./.gitlab-ci/variables/settings.xml \
      -t "$IMAGE_NAME:$CI_COMMIT_TAG" .
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG

.ssh_deploy_template: &ssh_setup
  image: alpine:3.19
  tags:
    - shared
  before_script:
    - set -euo pipefail
    # Install SSH client
    - apk add --no-cache openssh-client gettext util-linux
    # Start SSH agent and load the private key variable securely
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # Create the secure .ssh directory and disable strict host checking for automation
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

deploy_to_test:
  stage: deploy
  <<: *ssh_setup
  environment:
    name: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - set -euo pipefail
    - RANDOM_ID=$(uuidgen)
    # Export GitLab CI variables so envsubst can access them
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$CI_COMMIT_TAG

    - export DB_USER=$DB_USER
    - export DB_PASSWORD=$DB_PASSWORD
    - export DB_HOST=$DB_HOST
    - export DB_PORT=$DB_PORT
    - export DB_NAME=$DB_NAME

    # Now envsubst will replace ${VARIABLE} with exported values
    - envsubst < .gitlab-ci/templates/firmadigital-servicio.container.template > firmadigital-servicio.container.tmp
    - envsubst < .gitlab-ci/templates/firmadigital-servicio.env.template > firmadigital-servicio.env.tmp

    # Copy substituted files to test server
    - scp .gitlab-ci/templates/firmadigital-network.network.template sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-network-$RANDOM_ID.network
    - scp firmadigital-servicio.container.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-servicio-$RANDOM_ID.container
    - scp firmadigital-servicio.env.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-servicio-$RANDOM_ID.env
    # Execute commands remotely on your Test server via SSH
    - |
      ssh sdlc-bot@$CONTAINER_HOST "
        systemctl --user disable firmadigital-servicio --now || true &&
        mkdir -p ~/.config/containers/systemd/firmadigital-servicio || true &&
        cp /tmp/firmadigital-network-$RANDOM_ID.network /home/sdlc-bot/.config/containers/systemd/firmadigital-network.network &&
        cp /tmp/firmadigital-servicio-$RANDOM_ID.container /home/sdlc-bot/.config/containers/systemd/firmadigital-servicio.container &&
        cp /tmp/firmadigital-servicio-$RANDOM_ID.env /home/sdlc-bot/.config/containers/systemd/firmadigital-servicio/.env &&
        podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        podman pull $IMAGE_NAME:$CI_COMMIT_TAG &&
        systemctl --user daemon-reload &&
        systemctl --user start firmadigital-servicio
      "
deploy_to_prod:
  stage: deploy
  <<: *ssh_setup
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  when: manual
  script:
    - set -euo pipefail
    - RANDOM_ID=$(uuidgen)
    # Export GitLab CI variables so envsubst can access them
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$CI_COMMIT_TAG

    - export DB_USER=$DB_USER
    - export DB_PASSWORD=$DB_PASSWORD
    - export DB_HOST=$DB_HOST
    - export DB_PORT=$DB_PORT
    - export DB_NAME=$DB_NAME

    # Now envsubst will replace ${VARIABLE} with exported values
    - envsubst < .gitlab-ci/templates/firmadigital-servicio.container.template > firmadigital-servicio.container.tmp
    - envsubst < .gitlab-ci/templates/firmadigital-servicio.env.template > firmadigital-servicio.env.tmp

    # Copy substituted files to test server
    - scp .gitlab-ci/templates/firmadigital-network.network.template sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-network-$RANDOM_ID.network
    - scp firmadigital-servicio.container.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-servicio-$RANDOM_ID.container
    - scp firmadigital-servicio.env.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-servicio-$RANDOM_ID.env
    # Execute commands remotely on your Test server via SSH
    - |
      ssh sdlc-bot@$CONTAINER_HOST "
        systemctl --user disable firmadigital-servicio --now || true &&
        mkdir -p ~/.config/containers/systemd/firmadigital-servicio || true &&
        cp /tmp/firmadigital-network-$RANDOM_ID.network /home/sdlc-bot/.config/containers/systemd/firmadigital-network.network &&
        cp /tmp/firmadigital-servicio-$RANDOM_ID.container /home/sdlc-bot/.config/containers/systemd/firmadigital-servicio.container &&
        cp /tmp/firmadigital-servicio-$RANDOM_ID.env /home/sdlc-bot/.config/containers/systemd/firmadigital-servicio/.env &&
        podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        podman pull $IMAGE_NAME:$CI_COMMIT_TAG &&
        systemctl --user daemon-reload &&
        systemctl --user start firmadigital-servicio
      "
